const W=2000,H=1450;

let SC=1,offX=0,offY=0;
function resize(){
  const vw=innerWidth,vh=innerHeight,s=Math.min(vw/W,vh/H);
  const cw=W*s,ch=H*s;offX=(vw-cw)/2;offY=(vh-ch)/2;
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=offX+'px';cv.style.top=offY+'px';
  const bw=Math.min(W,Math.round(cw*Math.min(devicePixelRatio||1,2)));
  cv.width=bw;cv.height=Math.round(bw*H/W);SC=bw/W;
}
addEventListener('resize',resize);resize();

function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb(a){return 'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')'}
// auto-shade: front (south) and side (east) faces, tuned to tree/rock samples
function mat(top,front,side){

}

// ---------- projection (measured from tree/rock/car proportions) ----------
const EXx=147,EXy=42,EZx=30,EZy=-145,EY=100;
let OX=985,OY=1135,camX=0,camZ=0;
function sxp(x,z){return OX+(x-camX)*EXx+(z-camZ)*EZx}
function syp(x,z,y){return OY+(x-camX)*EXy+(z-camZ)*EZy-y*EY}

// draw an axis-aligned box: south (front), east (side) and top faces
function box(x0,z0,y0,w,d,h,m){
  const bx=sxp(x0,z0),by=syp(x0,z0,y0);
  const wx=w*EXx,wy=w*EXy,dx=d*EZx,dy=d*EZy,hh=h*EY;
  if(h>0.001){
    ctx.fillStyle=m[2];ctx.beginPath();
    ctx.moveTo(bx,by);ctx.lineTo(bx+wx,by+wy);ctx.lineTo(bx+wx+dx,by+wy+dy);
    ctx.lineTo(bx+wx+dx,by+wy+dy-hh);ctx.lineTo(bx+dx,by+dy-hh);ctx.lineTo(bx,by-hh);ctx.fill();
    ctx.fillStyle=m[1];ctx.beginPath();
    ctx.moveTo(bx,by);ctx.lineTo(bx+wx,by+wy);ctx.lineTo(bx+wx,by+wy-hh);ctx.lineTo(bx,by-hh);ctx.fill();
  }
  ctx.fillStyle=m[0];ctx.beginPath();
  ctx.moveTo(bx,by-hh);ctx.lineTo(bx+wx,by+wy-hh);ctx.lineTo(bx+wx+dx,by+wy+dy-hh);ctx.lineTo(bx+dx,by+dy-hh);ctx.fill();
}
// flat quad on ground plane at height y
function gquad(x0,z0,x1,z1,y){
  ctx.moveTo(sxp(x0,z0),syp(x0,z0,y));ctx.lineTo(sxp(x1,z0),syp(x1,z0,y));
  ctx.lineTo(sxp(x1,z1),syp(x1,z1,y));ctx.lineTo(sxp(x0,z1),syp(x0,z1,y));ctx.closePath();
}
// shadow: footprint swept along light direction (light from upper-left-back)
function shadowRect(x0,z0,w,d,h,y){
  const L=0.85*h,a=x0,b=z0,c=x0+w,e=z0+d;
  ctx.moveTo(sxp(a,b),syp(a,b,y));ctx.lineTo(sxp(c,b),syp(c,b,y));ctx.lineTo(sxp(c+L,b),syp(c+L,b,y));
  ctx.lineTo(sxp(c+L,e),syp(c+L,e,y));ctx.lineTo(sxp(a+L,e),syp(a+L,e,y));ctx.lineTo(sxp(a,e),syp(a,e,y));ctx.closePath();
}

// ---------- voxel models: boxes [x0,z0,y0,x1,z1,y1,mat], facing +z; pre-rotated & depth-sorted ----------
function prepModel(boxes){
  const out=[];
  for(let f=0;f<4;f++){
    const arr=boxes.map(b=>{
      const r=(x,z)=>f==0?[x,z]:f==1?[z,-x]:f==2?[-x,-z]:[-z,x];
      const p=r(b[0],b[1]),q=r(b[3],b[4]);
      return {src:b,x0:Math.min(p[0],q[0]),x1:Math.max(p[0],q[0]),z0:Math.min(p[1],q[1]),z1:Math.max(p[1],q[1]),y0:b[2],y1:b[5],m:b[6]};
    });
    // A drawn before B if separated with A farther from camera (camera is +x,-z,+y)
    const before=(A,B)=>A.x1<=B.x0+1e-6||A.z0>=B.z1-1e-6||A.y1<=B.y0+1e-6;
    const n=arr.length,indeg=new Array(n).fill(0),adj=arr.map(()=>[]);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(i!=j){
      const A=arr[i],B=arr[j];
      if(before(A,B)&&!before(B,A)){adj[i].push(j);indeg[j]++}
    }
    const q=[],res=[];for(let i=0;i<n;i++)if(!indeg[i])q.push(i);
    while(q.length){const i=q.shift();res.push(arr[i]);for(const j of adj[i])if(!--indeg[j])q.push(j)}
    for(let i=0;i<n;i++)if(res.indexOf(arr[i])<0)res.push(arr[i]);
    out.push(res);
  }
  return out;
}
// draw a model at any angle (turning cat, shop previews): faces culled by screen winding,
// shade blended smoothly between front and side colours, boxes re-sorted by true camera depth
const RGBC={};
function toRGB(c){if(RGBC[c])return RGBC[c];let v;if(c[0]==='#')v=hx(c);else v=c.match(/[\d.]+/g).map(Number);return RGBC[c]=v}
function mix(c1,c2,t){const a=toRGB(c1),b=toRGB(c2);return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')'}
function drawModelRot(mdl,x,z,y,ang,sxz,sy){
  const c=Math.cos(ang),s=Math.sin(ang),N=[[0,-1],[1,0],[0,1],[-1,0]];
  const L=mdl[0].map(b=>{const o=b.src,mx=(o[0]+o[3])/2*sxz,mz=(o[1]+o[4])/2*sxz,wx=mx*c+mz*s,wz=-mx*s+mz*c;
    return {o,k:wx-4.9*wz+7.53*(o[2]+o[5])/2*sy}}).sort((p,q)=>p.k-q.k);
  for(const {o} of L){const m=o[6],Y0=y+o[2]*sy,h=(o[5]-o[2])*sy*EY;
    const P4=[[o[0],o[1]],[o[3],o[1]],[o[3],o[4]],[o[0],o[4]]].map(([a,e])=>{a*=sxz;e*=sxz;const wx=x+a*c+e*s,wz=z-a*s+e*c;return [sxp(wx,wz),syp(wx,wz,Y0)]});
    if(h>0.01)for(let i=0;i<4;i++){const A=P4[i],B=P4[(i+1)%4];
      if((B[0]-A[0])*-h-(0)*(B[1]-A[1])>=0)continue;
      const nx=N[i][0]*c+N[i][1]*s,nz=-N[i][0]*s+N[i][1]*c;
      const t=Math.max(0,Math.min(1,(nx+nz)*.5+.5));
      ctx.fillStyle=mix(m[1],m[2],t);ctx.beginPath();
      ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.lineTo(B[0],B[1]-h);ctx.lineTo(A[0],A[1]-h);ctx.fill()}
    ctx.fillStyle=m[0];ctx.beginPath();for(let i=0;i<4;i++)ctx[i?'lineTo':'moveTo'](P4[i][0],P4[i][1]-h);ctx.fill();
  }
}
function drawModel(mdl,x,z,y,facing,sxz,sy,sw){
  const L=mdl[facing&3];sw=sw||sxz;
  for(const b of L)box(x+b.x0*sxz,z+b.z0*sw,y+b.y0*sy,(b.x1-b.x0)*sxz,(b.z1-b.z0)*sw,(b.y1-b.y0)*sy,b.m);
}

// ---------- world generation ----------
const PLAY=4,LOOP=26; // playable columns -4..4; lanes wrap over 26 tiles
const GY={grass:0,road:-.18,rail:-.18,river:-.32};
let rows=new Map(),genZ,lastKind,segLeft,segKind,pathCol,riverDir;
const R=Math.random,ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
function treeH(){const r=R();return r<.4?.75:r<.8?1.5:2.25}
function makeGrass(z,start){
  const row={z,kind:'grass',y:0,block:new Set(),trees:[],rocks:[],coins:[],fish:null};
  for(let x=-13;x<=13;x++){
    const edge=Math.abs(x)>PLAY;
    let p=edge?.42:start==='wall'?1:start==='back'?.35:start==='start'?.08:.2;
    if(!edge&&(x===pathCol||(start==='start'&&x===0)))p=0;
    if(R()<p){
      if(edge||R()<.72)row.trees.push({x,h:treeH()});else row.rocks.push({x});
      if(!edge)row.block.add(x);
    }else if(!edge&&!start&&R()<.07)row.coins.push({x});
  }
  if(!start&&R()<.12){const fx=ri(-PLAY,PLAY);if(!row.block.has(fx))row.fish={x:fx,t:R()*3,f:ri(0,3)}}
  return row;
}
function diff(z){return Math.min(1,z/160)}
function makeRoad(z,dashBelow){
  const d=diff(z),truck=R()<.28,len=truck?3.05:1.9,dir=R()<.5?1:-1;
  const speed=(truck?1.4:2)+R()*1.6+d*2.2;
  const n=Math.max(1,Math.min(5,ri(1,3)+Math.round(d*2)));
  const veh=[],step=LOOP/n;let o=R()*LOOP;
  const kind=truck?pick(TRUCKS):pick(CARS);
  for(let i=0;i<n;i++)veh.push({x:o+i*step+R()*Math.max(0,step-len-2.6),len,m:kind});
  return {z,kind:'road',y:GY.road,dir,speed,veh,dashBelow};
}
function makeRiver(z,pads){
  const d=diff(z);
  if(pads){const p=[],want=ri(2,4);let tries=0;while(p.length<want&&tries++<50){const x=ri(-PLAY,PLAY);if(p.every(q=>Math.abs(q-x)>1))p.push(x)}
    return {z,kind:'river',y:GY.river,pads:p,logs:[],dir:0,speed:0,coins:[]}}
  riverDir=-riverDir;
  const logs=[];let x=R()*3;
  while(x<LOOP-2){const len=R()<.15&&d<.6?4:ri(2,3);logs.push({x:x+len/2,len,coin:R()<.15?ri(0,len-1):-1});x+=len+1.4+R()*(1.4+d*1.5)}

}
function makeRail(z){return {z,kind:'rail',y:GY.rail,sig:ri(-3,3),timer:2+R()*5,warn:0,train:null,dir:R()<.5?1:-1}}
function genRow(){
  const z=genZ;let row;
  if(segLeft<=0){
    const d=diff(z);
    if(segKind!=='grass'&&R()<.72||segKind==='grass'&&false){segKind='grass';segLeft=R()<.6?1:R()<.75?2:3}
    else{
      const opts=['road','road','road','road','river','rail','rail'].filter(k=>k!==segKind);
      segKind=segKind==='grass'||!segKind?pick(['road','road','road','road','road','road','road','river','river','rail','rail','rail']):pick(opts);
      segLeft=segKind==='road'?ri(1,2+Math.round(d*2)):segKind==='river'?ri(2,3+Math.round(d)):ri(1,R()<.7?2:3);
    }
  }
  if(segKind==='grass'){pathCol=Math.max(-3,Math.min(3,pathCol+ri(-1,1)));row=makeGrass(z)}
  else if(segKind==='road'){const prev=rows.get(z-1);row=makeRoad(z,prev&&prev.kind==='road')}
  else if(segKind==='river'){const prev=rows.get(z-1);row=makeRiver(z,!(prev&&prev.kind==='river'&&prev.pads)&&R()<.18)}

function resetWorld(){
  rows=new Map();pathCol=0;riverDir=1;segKind='grass';segLeft=0;
  for(let z=-12;z<=-4;z++)rows.set(z,makeGrass(z,'wall'));
  for(let z=-3;z<=-1;z++)rows.set(z,makeGrass(z,'back'));
  rows.set(0,makeGrass(0,'start'));rows.set(1,makeGrass(1,'start'));rows.set(2,makeGrass(2,'start'));

// ---------- lane updates ----------
function wrap(x){x=(x+LOOP/2)%LOOP;if(x<0)x+=LOOP;return x-LOOP/2}
function updateRows(dt){
  for(const row of rows.values()){
    if(row.kind==='road')for(const v of row.veh)v.x=wrap(v.x+row.dir*row.speed*dt);
    else if(row.kind==='river'&&!row.pads)for(const l of row.logs)l.x=wrap(l.x+row.dir*row.speed*dt);
    else if(row.kind==='rail'){
      if(row.train){row.train.x+=row.dir*32*dt;if(Math.abs(row.train.x)>40){row.train=null;row.timer=3+R()*6}}
      else{row.timer-=dt;row.warn=row.timer<1.3?1:0;
        if(row.timer<=0){row.warn=0;row.train={x:-row.dir*(14+row.tlen/2),n:row.tn}}}
      if(!row.tn){row.tn=ri(3,6);row.tlen=row.tn*2.9}
    }else if(row.kind==='grass'&&row.fish){const f=row.fish;f.t+=dt;if(f.t>1.6){f.t=0;f.f=ri(0,3)}}
  }
}
function trainSpan(row){const t=row.train,h=row.tlen/2;return [t.x-h,t.x+h]}

// ---------- state ----------
const LOGO_X=500;let prevState='title',leaving=null,overScore=0;

// ---------- input: press = squash, release = hop (like the real game) ----------
let queue=[],held=null;
const KEYS={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{
  if(shopOpen){if(e.code==='Escape')shopOpen=false;e.preventDefault();return}

    if(state==='over'){if(deathT>1.2)newGame(),state='title';return}
    if(state==='title')state='play';

    held=KEYS[e.code];if(P.hop<0&&!P.dead)P.facing=[0,1,2,3][held];

});
addEventListener('keyup',e=>{if(e.code in KEYS&&held===KEYS[e.code]){if(state==='play'&&!paused)bufferHop(held);held=null}});
let pdown=null;
function toLogical(e){return [(e.clientX-offX)/(cv.clientWidth)*W,(e.clientY-offY)/(cv.clientHeight)*H]}
const PAUSE_BTN=[1790,215,122,122],PLAY_BTN=[885,1205,470,190];
function inB(p,b){return p[0]>=b[0]&&p[0]<=b[0]+b[2]&&p[1]>=b[1]&&p[1]<=b[1]+b[3]}
cv.addEventListener('pointerdown',e=>{
  const p=toLogical(e);

  if(state==='play'&&inB(p,PAUSE_BTN)){paused=!paused;return}
  if((state==='title'||paused||state==='over')&&inB(p,PLAY_BTN)){
    if(state==='title')state='play';else if(paused)paused=false;else if(deathT>1.2){newGame();state='title'}return}
  if(state==='over'||paused)return;

});
addEventListener('pointerup',e=>{
  if(!pdown)return;const p=toLogical(e),dx=p[0]-pdown[0],dy=p[1]-pdown[1];pdown=null;
  let d=0;if(Math.hypot(dx,dy)>60)d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy<0?0:2);
  held=null;if(!paused)bufferHop(d);

const DIRS=[[0,1],[1,0],[0,-1],[-1,0]];
// buffer at most ONE hop, and only briefly, so fast tapping never runs on after you stop
function bufferHop(d){queue.push({d,t:T});if(queue.length>2)queue.shift()}

function blocked(x,z){const r=rows.get(z);return !r||r.kind==='grass'&&r.block.has(Math.round(x))||z<-12}
function tryHop(d){
  P.facing=d;const [dx,dz]=DIRS[d];
  const tz=P.z+dz,tr=rows.get(tz);if(!tr)return;
  let tx=P.x+dx;
  if(tr.kind!=='river'||tr.pads)tx=Math.round(tx);
  if(tr.kind!=='river'&&(Math.abs(tx)>PLAY||blocked(tx,tz))){P.bump=.12;return}
  if(tr.kind==='river'&&tr.pads===null&&P.log===null&&Math.abs(tx)>PLAY){P.bump=.12;return}
  if(Math.abs(tx)>PLAY+.5){P.bump=.12;return}
  P.fx=P.x;P.fz=P.z;P.fy=P.y;P.tx=tx;P.tz=tz;P.ty=tr.kind==='river'?GY.river+.2:tr.y;

function landed(){
  P.x=P.tx;P.z=P.tz;P.y=P.ty;P.hop=-1;P.land=.1;
  const row=rows.get(P.z);
  if(row.kind==='river'){
    if(row.pads){const c=Math.round(P.x);if(row.pads.indexOf(c)>=0){P.x=c;P.y=GY.river+.05}else die('water')}
    else{let hit=null;for(const l of row.logs)if(Math.abs(wrap(P.x-l.x))<l.len/2+.15){hit=l;break}
      if(hit){const h=hit.len/2;let off=wrap(P.x-hit.x);off=Math.max(-h+.3,Math.min(h-.3,off));

function update(dt){

  if(state==='over')overScore=score;
  if(leaving)leaving.t+=dt;
  if(state==='title'){updateRows(dt);return}
  if(paused)return;
  updateRows(dt);

  while(genZ<camZ+24)genRow();
  for(const k of rows.keys())if(k<camZ-14&&k<-12)rows.delete(k);
  for(const k of rows.keys())if(k<camZ-14)rows.delete(k);

// ---------- rendering ----------
let T=0;

  // horizontal seams on canopy (front + side faces)
  ctx.fillStyle=M.treeSeam[0];ctx.beginPath();
  for(let s=y+.4+.3;s<y+.4+h-.1;s+=.3){const a=sxp(x-.33,z-.33),b=syp(x-.33,z-.33,s);
    ctx.moveTo(a,b);ctx.lineTo(a+.66*EXx,b+.66*EXy);ctx.lineTo(a+.66*EXx,b+.66*EXy+5);ctx.lineTo(a,b+5);ctx.closePath()}

function drawGround(row,z,xa,xb){
  const y=row.y;
  if(row.kind==='grass'){ctx.fillStyle=GRASS[((z%2)+2)%2];ctx.beginPath();gquad(xa,z-.5,xb,z+.5,0);ctx.fill();
    const fr=rows.get(z-1);
    if(fr&&fr.kind!=='grass'){ctx.fillStyle=fr.kind==='river'?BANK:GRASS_LIP;ctx.beginPath();
      ctx.moveTo(sxp(xa,z-.5),syp(xa,z-.5,0));ctx.lineTo(sxp(xb,z-.5),syp(xb,z-.5,0));
      ctx.lineTo(sxp(xb,z-.5),syp(xb,z-.5,fr.y));ctx.lineTo(sxp(xa,z-.5),syp(xa,z-.5,fr.y));ctx.fill()}
  }else if(row.kind==='road'){ctx.fillStyle=ROAD;ctx.beginPath();gquad(xa,z-.5,xb,z+.5,y);ctx.fill();

    if(row.logs)for(const l of row.logs)if(visX(l.x,z))gquad(l.x-l.len/2+.12,z-.42,l.x+l.len/2+.12,z+.3,y);
    ctx.fill();
  }else if(row.kind==='rail'){ctx.fillStyle=BED;ctx.beginPath();gquad(xa,z-.5,xb,z+.5,y);ctx.fill();
    ctx.fillStyle=M.tie[0];ctx.beginPath();for(let x=Math.floor(xa);x<xb;x++)gquad(x-.06,z-.42,x+.06,z+.42,y);ctx.fill();
    box(xa,z-.36,y,xb-xa,.09,.08,M.rail);box(xa,z+.27,y,xb-xa,.09,.08,M.rail);
    if(sigOn(row)){const gx=sxp(row.sig,z),gy=syp(row.sig,z,y);
      const g=ctx.createRadialGradient(gx,gy,10,gx,gy,330);g.addColorStop(0,'rgba(255,40,90,.55)');g.addColorStop(.55,'rgba(255,120,120,.25)');g.addColorStop(1,'rgba(255,230,90,0)');
      ctx.fillStyle=g;ctx.fillRect(gx-340,gy-340,680,680)}
  }
}
function sigOn(row){return !!row.warn}
function drawSignal(row,z){
  const x=row.sig+.35,zz=z+.42,y=row.y,on=sigOn(row),off=row.warn&&!on;
  for(let i=0;i<9;i++){const m=i===4?(on?M.poleL:off?M.lampOff:M.poleR):i%2?M.poleW:M.poleR;box(x-.05,zz-.05,y+i*.13,.1,.1,.13,m)}
  box(x-.3,zz-.06,y+1.0,.6,.12,.12,M.sigHead);box(x-.24,zz-.08,y+.9,.16,.16,.12,on?M.poleL:M.sigHead);box(x+.08,zz-.08,y+.9,.16,.16,.12,on?M.poleL:M.sigHead);
  box(x-.04,zz-.04,y+1.17,.08,.08,.1,M.poleW);
}
function drawPlayer(){
  if(P.dead==='water'&&P.sink>=1)return;
  let sy=1,sxz=1;
  if(P.hop>=0){const s=Math.sin(Math.PI*P.hop);sy=1+.25*s;sxz=1-.1*s}
  else{sy=1-.28*P.squash;sxz=1+.12*P.squash;if(P.land>0){sy*=1-.22*(P.land/.1);sxz*=1+.1*(P.land/.1)}}
  let x=P.x,z=P.z,y=P.y;
  if(P.bump>0){const [dx,dz]=DIRS[P.facing],b=Math.sin(P.bump/.12*Math.PI)*.12;x+=dx*b;z+=dz*b}
  if(P.dead==='carSide'){drawModel(curModel(),x,z,y,P.facing,1.25,1,.18);return}
  if(P.dead==='train'){if(P.landed){sy=1-.9*P.flat;sxz=1+.4*P.flat}else{drawModelRot(curModel(),x,z,y,P.ang+P.spinA,1,1);return}}
  if(P.dead==='car'){sy=1-.9*P.flat;sxz=1+.4*P.flat;y=P.y}
  if(P.dead==='water')y-=P.sink*.6;
  if(Math.abs(P.ang-P.facing*Math.PI/2)<.01)drawModel(curModel(),x,z,y,P.facing,sxz,sy);else drawModelRot(curModel(),x,z,y,P.ang,sxz,sy);
}
function rowObjects(row,z){
  const L=[];
  if(row.kind==='grass'){
    for(const t of row.trees)if(visX(t.x,z))L.push([t.x,0,()=>drawTree(t.x,z,0,t.h)]);
    for(const r of row.rocks)if(visX(r.x,z))L.push([r.x,0,()=>drawModel(ROCK,r.x,z,0,0,1,1)]);
    for(const c of row.coins)L.push([c.x,0,()=>drawModel(COIN,c.x,z,.12+Math.sin(T*3+c.x)*.04,0,1,1)]);
    if(row.fish){const f=row.fish;L.push([f.x,0,()=>drawModel(FISH,f.x,z,f.hop||0,f.f,1,1)])}
  }else if(row.kind==='road'){
    for(const v of row.veh)if(visX(v.x,z))L.push([v.x,0,()=>drawModel(v.m,v.x,z,row.y,row.dir>0?1:3,1,1)]);
  }else if(row.kind==='river'){
    if(row.pads)for(const p of row.pads)L.push([p,-1,()=>drawModel(PAD,p,z,row.y+Math.sin(T*2+p*1.7)*.015,0,1,1)]);
    else for(const l of row.logs)if(visX(l.x,z)){L.push([l.x,-1,()=>drawModel(logModel(l.len),l.x,z,row.y-.12,1,1,1)]);
      if(l.coin>=0){const cx=l.x-l.len/2+.5+l.coin;L.push([cx,-.5,()=>drawModel(COIN,cx,z,row.y+.1,0,1,1)])}}
  }else if(row.kind==='rail'){
    L.push([row.sig+.35,0,()=>drawSignal(row,z)]);
    if(row.train){const t=row.train,n=row.tn,h=row.tlen/2;
      for(let i=0;i<n;i++){const cx=row.dir>0?t.x+h-1.45-i*2.9:t.x-h+1.45+i*2.9;
        if(visX(cx,z))L.push([cx,0,()=>drawModel(i?TRAIN_CAR:TRAIN_ENGINE,cx,z,row.y,row.dir>0?1:3,1,1)])}}
  }
  return L;
}
function rowShadows(row,z){
  ctx.beginPath();
  if(row.kind==='grass'){for(const t of row.trees)if(visX(t.x,z))shadowRect(t.x-.33,z-.33,.66,.66,.4+t.h,0);
    for(const r of row.rocks)if(visX(r.x,z))shadowRect(r.x-.36,z-.32,.72,.64,.5,0)}
  else if(row.kind==='road'){for(const v of row.veh)if(visX(v.x,z))shadowRect(v.x-v.len/2,z-.36,v.len,.72,v.len>2.5?1.1:.7,row.y)}
  else if(row.kind==='rail'&&row.train){const s=trainSpan(row);shadowRect(s[0],z-.44,s[1]-s[0],.88,1.2,row.y)}
  if(P&&!(P.dead==='water')&&Math.round(P.z)===z){const gy=row.kind==='river'?row.y+.2:row.y;shadowRect(P.x-.2,P.z-.28,.4,.6,.45,gy)}
  ctx.fillStyle=SHADOW;ctx.fill();
}
function render(){
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.fillStyle='#4e5263';ctx.fillRect(0,0,W,H);
  // death zoom around the player
  const fx=P.dead?sxp(P.dx0,P.dz0):sxp(P.x,P.z),fy=P.dead?syp(P.dx0,P.dz0,0):syp(P.x,P.z,0);
  if(zoom>1.001){const k=(zoom-1)/.55,tx=fx+(1000-fx)*k*.6,ty=fy+(820-fy)*k*.6;
    ctx.setTransform(SC*zoom,0,0,SC*zoom,SC*(tx-fx*zoom),SC*(ty-fy*zoom))}
  const z0=Math.floor(camZ-7),z1=Math.ceil(camZ+12),xa=camX-15,xb=camX+15;
  const pRow=P.dead==='eagle'&&eagle&&eagle.got?null:(P.hop>=0?(P.hop<.5?P.fz:P.tz):Math.round(P.z));
  for(let z=z1;z>=z0;z--){
    const row=rows.get(z);if(!row)continue;
    drawGround(row,z,xa,xb);rowShadows(row,z);
    const L=rowObjects(row,z);
    if(pRow===z)L.push([P.x,P.dead==='car'||(P.dead==='train'&&P.landed)?-1:P.dead==='carSide'?(P.side<0?1:-1):0,drawPlayer]);
    L.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
    for(const o of L)o[2]();
    if(z===Math.round(P.z))for(const p of parts)box(p.x-p.s/2,p.z-p.s/2,p.y,p.s,p.s,p.s,p.m||M.splash);
  }
  if(eagle){if(eagle.got)drawModel(curModel(),P.x,P.z,P.y,P.facing,1,1);drawModel(EAGLE,eagle.x,eagle.z,eagle.y,0,1,1)}
  // darken outside the playable strip
  ctx.fillStyle='rgba(10,20,40,0.16)';ctx.beginPath();
  const za=camZ-10,zb=camZ+16;
  for(const [a,b] of [[camX-20,-PLAY-.5],[PLAY+.5,camX+20]]){
    ctx.moveTo(sxp(a,za),syp(a,za,0)+200);ctx.lineTo(sxp(b,za),syp(b,za,0)+200);ctx.lineTo(sxp(b,zb),syp(b,zb,0)-300);ctx.lineTo(sxp(a,zb),syp(a,zb,0)-300);ctx.closePath()}
  ctx.fill();
  ctx.setTransform(SC,0,0,SC,0,0);
  drawUI();
}

// ---------- pixel font (5x5) ----------
const F={
'0':'#####,#...#,#...#,#...#,#####','1':'##...,.#...,.#...,.#...,###..'.replace(/,/g,','),
'2':'####.,....#,.###.,#....,#####','3':'####.,....#,.###.,....#,####.','4':'#..#.,#..#.,#####,...#.,...#.',
'5':'#####,#....,####.,....#,####.','6':'.###.,#....,####.,#...#,.###.','7':'#####,...#.,..#..,.#...,.#...',
'8':'.###.,#...#,.###.,#...#,.###.','9':'.###.,#...#,.####,....#,.###.',
A:'.###.,#...#,#####,#...#,#...#',B:'####.,#...#,####.,#...#,####.',C:'.####,#....,#....,#....,.####',D:'####.,#...#,#...#,#...#,####.',
G:'.####,#....,#..##,#...#,.###.',N:'#...#,##..#,#.#.#,#..##,#...#',O:'.###.,#...#,#...#,#...#,.###.',P:'####.,#...#,####.,#....,#....',
S:'.####,#....,.###.,....#,####.',T:'#####,..#..,..#..,..#..,..#..',Y:'#...#,.#.#.,..#..,..#..,..#..',H:'#...#,#...#,#####,#...#,#...#',E:'#####,#....,####.,#....,#####',' ':'.....,.....,.....,.....,.....'};
F['1']='.##..,###..,.##..,.##..,####.';
F['7']='#####,#..##,...#.,..##.,..##.';
F['3']='####.,...##,.###.,...##,####.';
Object.assign(F,{E:'#####,#....,####.,#....,#####',F:'#####,#....,####.,#....,#....',H:'#...#,#...#,#####,#...#,#...#',I:'#####,..#..,..#..,..#..,#####',J:'..###,...#.,...#.,#..#.,.##..',K:'#...#,#..#.,###..,#..#.,#...#',L:'#....,#....,#....,#....,#####',M:'#...#,##.##,#.#.#,#...#,#...#',Q:'.###.,#...#,#.#.#,#..#.,.##.#',R:'####.,#...#,####.,#..#.,#...#',U:'#...#,#...#,#...#,#...#,.###.',V:'#...#,#...#,#...#,.#.#.,..#..',W:'#...#,#...#,#.#.#,##.##,#...#',X:'#...#,.#.#.,..#..,.#.#.,#...#',Z:'#####,...#.,..#..,.#...,#####'});
function textW(s,u){return s.length*6*u-u}
function drawText(s,x,y,u,col,outline,align){
  if(align==='right')x-=textW(s,u);else if(align==='center')x-=textW(s,u)/2;
  const o=outline;
  for(const pass of [0,1]){
    ctx.fillStyle=pass?col:'#000';ctx.beginPath();
    for(let i=0;i<s.length;i++){const g=F[s[i]];if(!g)continue;const L=g.split(',');
      for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(L[r][c]==='#'){
        const px=x+i*6*u+c*u,py=y+r*u;
        if(pass)ctx.rect(px,py,u+.5,u+.5);else ctx.rect(px-o,py-o,u+2*o,u+2*o+o*.9);
      }}
    ctx.fill();
  }
}
function drawCoinIcon(x,y,s){
  ctx.fillStyle='#000';ctx.fillRect(x+s*.2,y,s*.6,s);ctx.fillRect(x,y+s*.2,s,s*.6);ctx.fillRect(x+s*.08,y+s*.08,s*.84,s*.84);
  ctx.fillStyle='#f8e84e';ctx.fillRect(x+s*.26,y+s*.1,s*.48,s*.8);ctx.fillRect(x+s*.1,y+s*.26,s*.8,s*.48);ctx.fillRect(x+s*.17,y+s*.17,s*.66,s*.66);
  ctx.fillStyle='#fc1307';ctx.fillRect(x+s*.36,y+s*.32,s*.3,s*.1);ctx.fillRect(x+s*.36,y+s*.32,s*.1,s*.36);ctx.fillRect(x+s*.36,y+s*.58,s*.3,s*.1);
}
function drawPause(){
  const [x,y,w,h]=PAUSE_BTN,c=12;
  ctx.fillStyle='#fff';ctx.fillRect(x+c,y,w-2*c,h);ctx.fillRect(x,y+c,w,h-2*c);ctx.fillRect(x+c/2,y+c/2,w-c,h-c);
  ctx.fillStyle='#2457e0';ctx.fillRect(x+8,y+8,w-16,h-16);
  ctx.fillStyle='#55c6f7';ctx.fillRect(x+8,y+8,w-16,h-30);
  ctx.fillStyle='#b4e6fb';ctx.fillRect(x+16,y+8,w-32,8);
  ctx.fillStyle='#fff';
  if(paused){ctx.beginPath();ctx.moveTo(x+44,y+32);ctx.lineTo(x+86,y+56);ctx.lineTo(x+44,y+80);ctx.fill()}
  else{ctx.fillRect(x+36,y+34,18,46);ctx.fillRect(x+68,y+34,18,46)}
}
function drawPlayBtn(){
  const [x,y,w,h]=PLAY_BTN;
  ctx.fillStyle='#ff1a12';ctx.fillRect(x-18,y-10,w+36,h+20);ctx.fillRect(x-10,y-18,w+20,h+36);
  ctx.fillStyle='#fff';ctx.fillRect(x-8,y-2,w+16,h+4);ctx.fillRect(x-2,y-8,w+4,h+16);
  ctx.fillStyle='#be502a';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#f6bb39';ctx.fillRect(x,y,w,h-16);
  ctx.fillStyle='#fcd77a';ctx.fillRect(x+8,y,w-16,8);
  ctx.fillStyle='#fff';const cx=x+w/2-60,cy=y+h/2-8,u=14;
  for(let i=0;i<10;i++){const hh=(10-i)*u;ctx.fillRect(cx+i*u,cy-hh/2-(i<1?0:0),u+1,hh)}
}
function drawBanner(){
  ctx.fillStyle='#9861d8';ctx.fillRect(80,75,410,108);
  drawText(curChar().name,106,91,6.4,'#fff',0);drawText('HOPPY PETS',106,141,4.5,'#fff',0);
}
// logo, pre-rendered once (pixel letters with chamfers, black extrusion, tilted like the screenshot)
const LG={H:['##..##','##..##','######','######','##..##','##..##','##..##'],
P:['#####b','######','##..##','######','#####d','##....','##....'],
C:['a#####','######','##....','##....','##....','######','c#####'],
R:['#####b','######','##..##','#####d','####b.','##.###','##..##'],
O:['a####b','######','##..##','##..##','##..##','######','c####d'],
S:['a#####','######','##....','c####b','....##','######','#####d'],
Y:['##..##','##..##','######','c####d','..##..','..##..','..##..'],
A:['a####b','######','##..##','######','######','##..##','##..##'],
D:['#####b','######','##..##','##..##','##..##','######','#####d']};
const logo=document.createElement('canvas');logo.width=1700;logo.height=1050;
(function(){
  const g=logo.getContext('2d'),u=27;
  g.setTransform(1,.27,.1,1,60,40);
  const cell=(x,y,ch,pad)=>{
    const a=x-pad,b=y-pad,c=x+u+pad,d=y+u+pad;
    if(ch==='#'||pad>1){g.rect(a,b,c-a,d-b)}
    else if(ch==='a'){g.moveTo(c,b);g.lineTo(c,d);g.lineTo(a,d)}
    else if(ch==='b'){g.moveTo(a,b);g.lineTo(c,d);g.lineTo(a,d)}
    else if(ch==='c'){g.moveTo(a,b);g.lineTo(c,b);g.lineTo(c,d)}
    else if(ch==='d'){g.moveTo(a,b);g.lineTo(c,b);g.lineTo(a,d)}
    g.closePath();
  };
  const lines=[['HOPPY',0,0],['ROAD',3.75*u,8*u]];
  const each=f=>{for(const [w,ox,oy] of lines)for(let i=0;i<w.length;i++){const G=LG[w[i]];
    for(let r=0;r<7;r++)for(let c=0;c<6;c++){const ch=G[r][c];if(ch!=='.')f(ox+i*7.5*u+c*u,oy+r*u,ch)}}};
  g.fillStyle='#000';
  for(let d=0;d<=84;d+=4){g.beginPath();each((x,y,ch)=>cell(x+d*.12,y+d,ch,19));g.fill()}
  g.fillStyle='#fff';g.beginPath();each((x,y,ch)=>cell(x,y,ch,0.6));g.fill();
})();
function withOff(dx,dy,a,fn){ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.setTransform(SC,0,0,SC,SC*dx,SC*dy);fn();ctx.restore()}
function drawUI(){
  if(leaving&&state==='play'&&leaving.t<.35){const e=leaving.t/.35,k=e*e,a=1-e;
    if(leaving.from==='title'){withOff(-700*k,0,a,drawBanner);withOff(0,-900*k,a,()=>ctx.drawImage(logo,LOGO_X,320+Math.sin(T*2)*8))}
    else withOff(0,-500*k,a,()=>{drawText(String(leaving.score),52,95,30,'#fff',10);drawText('TOP '+best,52,270,11,'#fff',6)});
    withOff(-320*k,0,a,drawCustTile);withOff(0,500*k,a,drawPlayBtn)}
  if((state==='title'||state==='over')&&!shopOpen)drawCustTile();
  if(shopOpen)drawShop();
  if(state==='title'&&!shopOpen){drawBanner();ctx.drawImage(logo,LOGO_X,320+Math.sin(T*2)*8)}
  // coins top-right
  const cs=String(coins);drawText(cs,1840,110,17,'#f8e84e',8,'right');drawCoinIcon(1850,125,62);
  if(state==='play'){if(started||P.dead)drawText(String(score),52,95,17,'#fff',8);drawPause();if(paused)drawPlayBtn()}
  if(state==='over'&&!shopOpen){drawText(String(score),52,95,30,'#fff',10);drawText('TOP '+best,52,270,11,'#fff',6);drawPlayBtn()}
  if(state==='title'&&!shopOpen)drawPlayBtn();
}

// ---------- customize button + character shop ----------
const CUST_BTN=[0,560,250,330],SHOP_CLOSE=[220,130,90,90];
function shopCard(i){return [275+(i%4)*370,290+Math.floor(i/4)*510,340,480]}
function drawPreview(mdl,cx,cy,k,ang){
  const s=[OX,OY,camX,camZ],t0=ctx.getTransform();OX=0;OY=0;camX=0;camZ=0;
  ctx.setTransform(t0.a*k,0,0,t0.d*k,t0.e+t0.a*cx,t0.f+t0.d*cy);drawModelRot(mdl,0,0,0,ang,1,1);
  ctx.setTransform(t0);OX=s[0];OY=s[1];camX=s[2];camZ=s[3];
}
function drawCustTile(){
  const [x,y,w,h]=CUST_BTN;
  ctx.fillStyle='#292927';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#16acf4';ctx.fillRect(x,y+12,w-12,h-24);
  ctx.fillStyle='#6acceb';ctx.fillRect(x,y+12,w-12,h-40);
  ctx.save();ctx.beginPath();ctx.rect(x,y+12,w-12,h-40);ctx.clip();drawPreview(curModel(),x+(w-12)/2-8,y+h*.62-Math.max(0,Math.sin(T*4))*16,1.7,Math.PI-.5);ctx.restore();
  drawText('CUSTOMIZE',x+(w-12)/2,y+h-60,3.4,'#fff',2,'center');
}
function drawShop(){
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#292927';ctx.fillRect(200,110,1600,1240);
  drawText('CHARACTERS',1000,150,9,'#fff',4,'center');
  const [cx,cy,cw,ch]=SHOP_CLOSE;
  ctx.fillStyle='#2457e0';ctx.fillRect(cx,cy,cw,ch);ctx.fillStyle='#55c6f7';ctx.fillRect(cx,cy,cw,ch-12);
  drawText('X',cx+cw/2,cy+20,9,'#fff',0,'center');
  CHARS.forEach((c,i)=>{
    const [x,y,w,h]=shopCard(i),own=owned.includes(c.id),on=sel===c.id;
    ctx.fillStyle=on?'#16acf4':'#1d1d24';ctx.fillRect(x,y,w,h);
    ctx.fillStyle=on?'#6acceb':own?'#4a4a5c':'#3a3a46';ctx.fillRect(x,y,w,h-12);
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h-12);ctx.clip();drawPreview(c.m,x+w/2-8,y+270-(on?Math.max(0,Math.sin(T*5))*22:0),1.9,Math.PI-.5);ctx.restore();
    drawText(c.name,x+w/2,y+330,5,'#fff',2,'center');
    if(shopMsg&&shopMsg.i===i&&T-shopMsg.t<1.2)drawText('NEED MORE',x+w/2,y+400,5,'#ff6b6b',2,'center');
    else if(on)drawText('SELECTED',x+w/2,y+400,5,'#fff',2,'center');
    else if(own)drawText('OWNED',x+w/2,y+400,5,'#f8e84e',2,'center');
    else{const s=String(c.price),tw=textW(s,6),tot=50+12+tw,sx=x+w/2-tot/2;
      drawCoinIcon(sx,y+398,46);drawText(s,sx+62,y+400,6,coins>=c.price?'#f8e84e':'#ff6b6b',3)}
  });
}
function shopClick(p){
  if(inB(p,SHOP_CLOSE)||!inB(p,[200,110,1600,1240])){shopOpen=false;return}
  CHARS.forEach((c,i)=>{
    if(!inB(p,shopCard(i)))return;
    if(owned.includes(c.id)){sel=c.id;saveChars()}
    else if(coins>=c.price){coins-=c.price;owned.push(c.id);sel=c.id;save();saveChars()}
    else shopMsg={i,t:T};
  });
}

// ---------- main loop ----------
newGame();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  update(dt);render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
